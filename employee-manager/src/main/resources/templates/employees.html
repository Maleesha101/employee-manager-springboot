<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Employee Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .error { color: #dc3545; font-size: 0.875rem; }
        .success { color: #198754; }
    </style>
</head>
<body>
<div class="container mt-4">
    <h2 class="mb-4">Employee Management System</h2>

    <!-- Success / Error messages -->
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <!-- Add Employee Form -->
    <div class="card mb-4">
        <div class="card-header">
            <h5 class="mb-0">Add New Employee</h5>
        </div>
        <div class="card-body">
            <form th:action="@{/employees}" th:object="${employee}" method="post">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-control" th:field="*{name}" placeholder="Enter full name">
                        <div class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" th:field="*{email}" placeholder="Enter email">
                        <div class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Phone</label>
                        <input type="text" class="form-control" th:field="*{phone}" placeholder="10-digit phone">
                        <div class="error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Department</label>
                        <input type="text" class="form-control" th:field="*{department}" placeholder="e.g. IT, HR">
                        <div class="error" th:if="${#fields.hasErrors('department')}" th:errors="*{department}"></div>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Salary</label>
                        <input type="number" step="0.01" class="form-control" th:field="*{salary}" placeholder="Salary">
                        <div class="error" th:if="${#fields.hasErrors('salary')}" th:errors="*{salary}"></div>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary mt-3">Save Employee</button>
            </form>
        </div>
    </div>

    <!-- Employee Table -->
    <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
            <h5 class="mb-0">Employee List</h5>
            <span class="badge bg-secondary" th:text="${employees != null ? employees.size() : 0} + ' employees'"></span>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped table-hover">
                    <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Full Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Department</th>
                        <th>Salary</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${employees == null or employees.isEmpty()}">
                        <td colspan="7" class="text-center text-muted">No employees found. Add one above.</td>
                    </tr>
                    <tr th:each="emp : ${employees}">
                        <td th:text="${emp.id}"></td>
                        <td th:text="${emp.name}"></td>
                        <td th:text="${emp.email}"></td>
                        <td th:text="${emp.phone}"></td>
                        <td th:text="${emp.department}"></td>
                        <td th:text="${emp.salary}"></td>
                        <td>
                            <a th:href="@{/employees/{id}/edit(id=${emp.id})}" class="btn btn-sm btn-warning">Edit</a>
                            <form th:action="@{/employees/{id}/delete(id=${emp.id})}" method="post" style="display:inline;"
                                  onsubmit="return confirm('Are you sure you want to delete this employee?');">
                                <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
